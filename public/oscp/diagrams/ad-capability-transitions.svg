<svg aria-labelledby="diagram-title diagram-description" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img"><title id="diagram-title">AD: follow a verified capability</title><desc id="diagram-description">Top row: choose and validate a path. After its result, use the bottom row. A graph edge is a candidate, not proof.</desc><rect width="1120" height="560" fill="#f7f8fa" /><text font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="start" x="32" y="47" fill="#152936"><tspan x="32" dy="0">AD: follow a verified capability</tspan></text><rect stroke-width="2" x="32" y="95" width="260" height="120" rx="7" fill="white" stroke="#37647a" /><text font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" x="162.0" y="149.0" fill="#152936"><tspan x="162.0" dy="0">Known identity</tspan><tspan x="162.0" dy="24">+ source host</tspan></text><rect stroke-width="2" x="430" y="95" width="260" height="120" rx="7" fill="white" stroke="#37647a" /><text font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" x="560.0" y="149.0" fill="#152936"><tspan x="560.0" dy="0">Map groups, ACLs,</tspan><tspan x="560.0" dy="24">SPNs and sessions</tspan></text><rect stroke-width="2" x="828" y="95" width="260" height="120" rx="7" fill="white" stroke="#37647a" /><text font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" x="958.0" y="149.0" fill="#152936"><tspan x="958.0" dy="0">Validate one right</tspan><tspan x="958.0" dy="24">on the exact object</tspan></text><rect stroke-width="2" x="32" y="335" width="260" height="120" rx="7" fill="white" stroke="#37647a" /><text font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" x="162.0" y="389.0" fill="#152936"><tspan x="162.0" dy="0">New identity, ticket</tspan><tspan x="162.0" dy="24">or host access</tspan></text><rect stroke-width="2" x="430" y="335" width="260" height="120" rx="7" fill="white" stroke="#37647a" /><text font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" x="560.0" y="389.0" fill="#152936"><tspan x="560.0" dy="0">Choose a compatible</tspan><tspan x="560.0" dy="24">reachable service</tspan></text><rect stroke-width="2" x="828" y="335" width="260" height="120" rx="7" fill="white" stroke="#37647a" /><text font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" x="958.0" y="389.0" fill="#152936"><tspan x="958.0" dy="0">Verify host + token</tspan><tspan x="958.0" dy="24">then enumerate again</tspan></text><line stroke-width="2" x1="292" y1="155.0" x2="430" y2="155.0" stroke="#37647a" /><polygon points="430,155.0 420,150.0 420,160.0" fill="#37647a" /><text font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" x="361.0" y="143.0" fill="#394d5a"><tspan x="361.0" dy="0">DNS / DC / time</tspan></text><line stroke-width="2" x1="690" y1="155.0" x2="828" y2="155.0" stroke="#37647a" /><polygon points="828,155.0 818,150.0 818,160.0" fill="#37647a" /><text font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" x="759.0" y="143.0" fill="#394d5a"><tspan x="759.0" dy="0">candidate edge</tspan></text><line stroke-width="2" x1="292" y1="395.0" x2="430" y2="395.0" stroke="#37647a" /><polygon points="430,395.0 420,390.0 420,400.0" fill="#37647a" /><text font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" x="361.0" y="383.0" fill="#394d5a"><tspan x="361.0" dy="0">credential type</tspan></text><line stroke-width="2" x1="690" y1="395.0" x2="828" y2="395.0" stroke="#37647a" /><polygon points="828,395.0 818,390.0 818,400.0" fill="#37647a" /><text font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" x="759.0" y="383.0" fill="#394d5a"><tspan x="759.0" dy="0">authorization</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" x="32" y="537" fill="#394d5a"><tspan x="32" dy="0">Top row: choose and validate a path. After its result, use the bottom row. A graph edge is a candidate, not proof.</tspan></text></svg>